# Entorno local reproducible.
#   docker compose up -d api         -> db → migrate → api en http://127.0.0.1:8008
#   docker compose run --rm tests    -> lint, tipos y pruebas (incluidas las de BD, contra aletheia_test)
#   docker compose run --rm demo     -> flujo emisión/verificación/revocación con datos ficticios
#   docker compose run --rm db-test  -> comprueba esquema, restricciones y privilegios en SQL
#   docker compose run --rm maintenance -> purga de datos caducados
name: aletheia

x-hardening: &hardening
  read_only: true
  tmpfs:
    - /tmp:mode=1777,size=128m   # escribible por el usuario no root
  cap_drop: [ALL]
  security_opt:
    - no-new-privileges:true
  init: true

x-app-env: &app-env
  ALETHEIA_ENV: development
  ALETHEIA_DATABASE_URL: postgresql+psycopg://aletheia_app:${ALETHEIA_APP_PASSWORD:-dev-app-password}@db:5432/aletheia
  ALETHEIA_LOG_FORMAT: text
  ALETHEIA_PUBLIC_BASE_URL: http://127.0.0.1:8008
  ALETHEIA_SIGNING_BACKEND: local_dev
  ALETHEIA_DEV_KEYS_DIR: /var/lib/aletheia/dev-keys
  ALETHEIA_OID4VCI_TOKEN_RATE_LIMIT: ${ALETHEIA_OID4VCI_TOKEN_RATE_LIMIT:-60}
  ALETHEIA_DEMO_ORGANIZATION: ${ALETHEIA_DEMO_ORGANIZATION:-}

services:
  tests:
    <<: *hardening
    build:
      context: .
      target: test
    image: aletheia:test
    depends_on:
      db:
        condition: service_healthy
    environment:
      ALETHEIA_ENV: test
      # Las pruebas de BD migran/revierten: base propia, con el rol propietario.
      ALETHEIA_TEST_DATABASE_URL: postgresql+psycopg://aletheia_migrate:${ALETHEIA_DB_PASSWORD:-dev-migrate-password}@db:5432/aletheia_test
      ALETHEIA_TEST_APP_DATABASE_URL: postgresql+psycopg://aletheia_app:${ALETHEIA_APP_PASSWORD:-dev-app-password}@db:5432/aletheia_test
      ALETHEIA_DEV_KEYS_DIR: /tmp/dev-keys

  demo:
    <<: *hardening
    build:
      context: .
      target: runtime
    image: aletheia:runtime
    network_mode: none   # el núcleo no necesita red
    environment:
      ALETHEIA_ENV: development
    command: ["demo"]

  migrate:
    <<: *hardening
    image: aletheia:runtime
    depends_on:
      db:
        condition: service_healthy
    environment:
      <<: *app-env
      # Las migraciones corren con el rol propietario del esquema.
      ALETHEIA_DATABASE_URL: postgresql+psycopg://aletheia_migrate:${ALETHEIA_DB_PASSWORD:-dev-migrate-password}@db:5432/aletheia
    command: ["migrate"]

  api:
    <<: *hardening
    image: aletheia:runtime
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      <<: *app-env
    volumes:
      - dev-keys:/var/lib/aletheia/dev-keys   # claves PEM de desarrollo; nunca en el repositorio
    ports:
      - "127.0.0.1:${ALETHEIA_API_PORT:-8008}:8000"
    command: ["api"]

  maintenance:
    <<: *hardening
    image: aletheia:runtime
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      <<: *app-env
    command: ["maintenance"]

  # docker compose run --rm -e ALETHEIA_BOOTSTRAP_PASSWORD=... bootstrap \
  #   --name "Universidad Demo" --owner-email owner@example.org --owner-name "Propietaria"
  bootstrap:
    <<: *hardening
    image: aletheia:runtime
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      <<: *app-env
    volumes:
      - dev-keys:/var/lib/aletheia/dev-keys
    entrypoint: ["python", "-m", "aletheia", "bootstrap"]

  # Interoperabilidad con @sd-jwt/sd-jwt-vc (OpenWallet Foundation) contra la API en marcha.
  # docker compose run --rm -e ALETHEIA_PASSWORD=... interop
  interop:
    image: node:22-alpine
    depends_on:
      api:
        condition: service_healthy
    working_dir: /interop
    volumes:
      - ./interop:/interop:ro
    tmpfs:
      - /tmp:mode=1777,size=256m
    environment:
      ALETHEIA_API: http://api:8000
      ALETHEIA_PUBLIC_BASE: http://127.0.0.1:8008
      ALETHEIA_EMAIL: ${ALETHEIA_EMAIL:-owner@example.org}
      npm_config_cache: /tmp/npm-cache
    user: "1000:1000"
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    # Copia a /tmp para instalar sin escribir en el repositorio; npm ci respeta el lock exacto.
    command: ["sh", "-c", "cp -r /interop/package.json /interop/package-lock.json /interop/run.mjs /tmp/ && cd /tmp && npm ci --no-audit --no-fund --silent && node run.mjs"]

  # Túnel HTTPS temporal para probar con un teléfono (docs/poc-iphone.md). Expone la API a Internet:
  # sólo bajo el perfil "tunnel" y detenerlo al terminar.
  tunnel:
    image: cloudflare/cloudflared:2025.9.1
    profiles: ["tunnel"]
    depends_on:
      api:
        condition: service_healthy
    command: ["tunnel", "--no-autoupdate", "--url", "http://api:8000"]
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true

  db:
    image: postgres:16-alpine
    # Contraseñas sólo para desarrollo local; en AWS las gestiona Secrets Manager (doc 02 §6).
    environment:
      POSTGRES_DB: aletheia
      POSTGRES_USER: aletheia_migrate
      POSTGRES_PASSWORD: ${ALETHEIA_DB_PASSWORD:-dev-migrate-password}
      ALETHEIA_APP_PASSWORD: ${ALETHEIA_APP_PASSWORD:-dev-app-password}
      POSTGRES_INITDB_ARGS: "--data-checksums"
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:${ALETHEIA_DB_PORT:-5433}:5432"
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]   # lo mínimo que necesita el entrypoint oficial
    security_opt:
      - no-new-privileges:true
    init: true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aletheia_migrate -d aletheia"]
      interval: 5s
      timeout: 3s
      retries: 12

  db-test:
    image: postgres:16-alpine
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      PGHOST: db
      PGDATABASE: aletheia
      PGUSER: aletheia_migrate
      PGPASSWORD: ${ALETHEIA_DB_PASSWORD:-dev-migrate-password}
      ALETHEIA_APP_PASSWORD: ${ALETHEIA_APP_PASSWORD:-dev-app-password}
    volumes:
      - ./db/tests:/tests:ro
    read_only: true
    tmpfs:
      - /tmp:mode=1777,size=16m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    init: true
    user: "70:70"   # usuario postgres de la imagen alpine
    entrypoint: ["sh", "/tests/run.sh"]

volumes:
  db-data:
  dev-keys:
