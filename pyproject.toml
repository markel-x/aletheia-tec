[project]
name = "aletheia"
version = "0.1.0"
description = "Plataforma para emitir, administrar y verificar credenciales digitales verificables (perfil ALT-P1: SD-JWT VC)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Propietario" }
# Versiones exactas y hashes en uv.lock (ADR-0011).
dependencies = [
  "cryptography>=46.0.7",
  "PyJWT>=2.12.1",
  "pydantic>=2.13",
  "pydantic-settings>=2.14",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.46",
  "SQLAlchemy>=2.0.36,<2.1",
  "alembic>=1.14",
  "psycopg[binary]>=3.2",
  "argon2-cffi>=23.1",
  "boto3>=1.35",
  "httpx>=0.28",
]

[project.scripts]
aletheia = "aletheia.cli:main"

[dependency-groups]
dev = [
  "pytest>=9.0.3",
  "ruff>=0.15.11",
  "mypy>=1.20.2",
]

[tool.uv]
required-version = ">=0.12"

[tool.hatch.build.targets.wheel.force-include]
# Los .sql y .mako de las migraciones viajan con el paquete.
"src/aletheia/db/migrations/sql" = "aletheia/db/migrations/sql"
"src/aletheia/db/migrations/script.py.mako" = "aletheia/db/migrations/script.py.mako"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aletheia"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers"
markers = [
  "db: requiere PostgreSQL",
  "aws: requiere credenciales AWS reales (nunca en CI por defecto)",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "BLE", "SIM", "RUF", "PT"]
ignore = ["RUF001", "RUF002", "RUF003"]  # textos en español con tildes/ñ

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "PT018"]
"src/aletheia/db/migrations/versions/*" = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["aletheia"]
mypy_path = "src"
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["aletheia.db.migrations.env", "aletheia.db.migrations.versions.*"]
disallow_untyped_calls = false
