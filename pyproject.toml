[project]
name = "aletheia"
version = "0.1.0"
description = "Plataforma para emitir, administrar y verificar credenciales digitales verificables (perfil ALT-P1: SD-JWT VC)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Propietario" }
# Rangos mínimos. Las versiones exactas se fijan en uv.lock (incremento 2;
# requiere acceso a PyPI, no disponible en el entorno del incremento 1).
dependencies = [
  "cryptography>=46.0.7",
  "PyJWT>=2.12.1",
  "pydantic>=2.13",
  "pydantic-settings>=2.14",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.46",
  "SQLAlchemy>=2.0.36,<2.1",
  "alembic>=1.14",
  "psycopg[binary]>=3.2",
  "argon2-cffi>=23.1",
  "boto3>=1.35",
  "httpx>=0.28",
]

[dependency-groups]
dev = [
  "pytest>=9.0",
  "ruff>=0.15",
  "mypy>=1.13",
  "moto[kms]>=5.0",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aletheia"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers"
markers = [
  "db: requiere PostgreSQL",
  "aws: requiere credenciales AWS reales (nunca en CI por defecto)",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "BLE", "SIM", "RUF", "PT"]
ignore = ["RUF001", "RUF002", "RUF003"]  # textos en español con tildes/ñ

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "PT018"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["aletheia.vc"]
mypy_path = "src"
