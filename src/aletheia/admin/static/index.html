<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Aletheia</title>
  <link rel="stylesheet" href="/admin/static/style.css">
</head>
<body>
  <!-- Acceso -->
  <div id="auth" class="auth" hidden>
    <div class="auth-card" id="auth-card"></div>
    <footer class="auth-footer">
      <nav>
        <a href="/docs" target="_blank" rel="noopener">API</a>
      </nav>
      <span data-i18n="footer.tagline">Aletheia · credenciales verificables</span>
      <span id="auth-lang"></span>
    </footer>
  </div>

  <!-- Aplicación -->
  <div id="shell" class="shell" hidden>
    <aside class="sidebar" id="sidebar">
      <a class="brand" href="#/overview" aria-label="Aletheia · inicio" data-i18n-aria-label="nav.home">
        <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true">
          <path d="M16 2 28 8v8c0 7.2-5 12.6-12 14C9 28.6 4 23.2 4 16V8z" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/>
          <path d="m10.5 16.2 3.8 3.8 7.4-8" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span class="brand-name">aletheia</span>
      </a>
      <nav id="nav" class="nav" aria-label="Principal" data-i18n-aria-label="nav.main">
        <a href="#/overview" data-icon="grid" data-i18n="nav.overview">Resumen</a>
        <div class="nav-row" data-group="credentials">
          <a href="#/credentials" class="nav-parent" data-icon="badge" data-i18n="nav.credentials">Credenciales</a>
          <button type="button" class="nav-toggle" aria-expanded="true" aria-controls="nav-sub-credentials">▾</button>
        </div>
        <div class="nav-sub" id="nav-sub-credentials">
          <a href="#/credentials" data-i18n="cred.list">Emitidas y pendientes</a>
          <a href="#/credentials/new" data-i18n="cred.new_offer">Nueva oferta</a>
        </div>
        <div class="nav-row" data-group="templates">
          <a href="#/templates" class="nav-parent" data-icon="layers" data-i18n="nav.templates">Plantillas</a>
          <button type="button" class="nav-toggle" aria-expanded="true" aria-controls="nav-sub-templates">▾</button>
        </div>
        <div class="nav-sub" id="nav-sub-templates">
          <a href="#/templates" data-i18n="tpl.list">Mis plantillas</a>
          <a href="#/templates/new" data-i18n="tpl.new">Nueva plantilla</a>
        </div>
        <a href="#/verify" data-icon="check" data-i18n="nav.verify">Verificación</a>
        <span class="nav-group" data-i18n="nav.organization">Organización</span>
        <a href="#/settings" data-icon="gear" data-i18n="nav.settings">Configuración</a>
        <a href="#/members" data-icon="users" data-i18n="nav.members">Miembros</a>
        <a href="#/api-clients" data-icon="key" data-i18n="nav.api_clients">Claves de API</a>
        <a href="#/signing-keys" data-icon="pen" data-i18n="nav.signing_keys">Claves de firma</a>
        <a href="#/audit" data-icon="list" data-i18n="nav.audit">Auditoría</a>
        <a href="#/usage" data-icon="chart" data-i18n="nav.usage">Consumo</a>
      </nav>
      <div class="sidebar-footer">
        <a href="#/help" data-icon="help" data-i18n="nav.help">Ayuda</a>
        <a href="/docs" target="_blank" rel="noopener" data-icon="code">API</a>
        <div id="who" class="who"></div>
        <button type="button" class="collapse" id="collapse" aria-label="Contraer menú" title="Contraer menú" data-i18n-aria-label="nav.collapse" data-i18n-title="nav.collapse">⇤</button>
      </div>
    </aside>
    <div class="main">
      <header class="topbar">
        <div class="crumbs" id="crumbs"></div>
        <div class="topbar-right" id="topbar-right"></div>
      </header>
      <main id="app" class="content"><p class="muted" data-i18n="common.loading">Cargando…</p></main>
    </div>
  </div>

  <div id="toast" class="toast" hidden></div>
  <script type="module" src="/admin/static/app.js"></script>
</body>
</html>
