# CI: las mismas imágenes y comandos que en local (compose). Sin credenciales de AWS:
# la infraestructura se valida estáticamente.
name: ci

# En main la ejecuta deploy.yml (workflow_call) antes de desplegar: no se duplica.
on:
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TRIVY_IMAGE: aquasec/trivy:0.63.0

jobs:
  app:
    name: lint, tipos, pruebas (PostgreSQL + RLS), interoperabilidad
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      ALETHEIA_BOOTSTRAP_PASSWORD: ci-owner-password-not-secret
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Construir imágenes
        run: docker compose build
      - name: Lint, mypy y pytest (API con el rol de la app y RLS activo)
        run: docker compose run --rm tests
      - name: Pruebas SQL del esquema, privilegios y RLS
        run: docker compose run --rm db-test
      - name: Demostración del núcleo
        run: docker compose run --rm demo > /dev/null
      - name: API arranca y responde /readyz
        run: |
          docker compose up -d api
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8008/readyz; then echo; exit 0; fi
            sleep 2
          done
          docker compose logs api migrate db
          exit 1
      - name: Interoperabilidad con @sd-jwt/sd-jwt-vc (implementación independiente)
        run: |
          docker compose run --rm -e ALETHEIA_BOOTSTRAP_PASSWORD bootstrap \
            --name "CI" --owner-email owner@example.org --owner-name "CI"
          docker compose run --rm -e ALETHEIA_PASSWORD="$ALETHEIA_BOOTSTRAP_PASSWORD" interop
      - name: Escaneo de la imagen (HIGH/CRITICAL con corrección disponible)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "$TRIVY_IMAGE" \
            image --quiet --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 aletheia:runtime
      - name: SBOM (CycloneDX)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "$TRIVY_IMAGE" \
            image --quiet --format cyclonedx aletheia:runtime > sbom.cdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.cdx.json
      - name: Detener
        if: always()
        run: docker compose down -v

  infra:
    name: terraform fmt + validate + escaneo
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.13.5"
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false
      - run: terraform validate
      - name: Escaneo de configuración (Trivy; excepciones justificadas en línea)
        run: |
          docker run --rm -v "$PWD:/src:ro" "$TRIVY_IMAGE" \
            config --quiet --severity MEDIUM,HIGH,CRITICAL --exit-code 1 /src
