# Despliegue a AWS (staging automático desde main; production manual con aprobación).
#
# Requisitos por entorno de GitHub (Settings → Environments → staging / production):
#   variables: AWS_DEPLOY_ROLE_ARN, AWS_REGION, ECR_REPOSITORY, ECS_CLUSTER, ECS_SERVICE,
#              API_TASK_FAMILY, MIGRATE_TASK_FAMILY, MAINT_TASK_FAMILY, PRIVATE_SUBNETS,
#              APP_SECURITY_GROUP, PUBLIC_BASE_URL, SMOKE_BASE_URL   (salida "deploy_config" de Terraform)
#   production: revisores obligatorios.
# Y una variable de REPOSITORIO DEPLOY_ENABLED=true: las variables de entorno no están disponibles
# en el `if` del trabajo (se resuelven al empezar), así que no sirven para decidir si se ejecuta.
# Sin credenciales permanentes: OIDC → rol con permisos sólo de despliegue (infra/terraform/ci.tf).
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: Entorno
        type: choice
        options: [staging, production]
        default: staging

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-${{ inputs.environment || 'staging' }}
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: ci
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: ${{ inputs.environment || 'staging' }}
    # Sin DEPLOY_ENABLED el trabajo se omite (CI igualmente corre) en lugar de fallar.
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      IMAGE_TAG: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      # Las etiquetas de ECR son inmutables: si este commit ya tiene imagen (redespliegue manual,
      # p. ej. tras un cambio de Terraform), se reutiliza en lugar de reconstruirla.
      - name: ¿Ya existe la imagen de este commit?
        id: existing
        run: |
          if aws ecr describe-images --repository-name "${{ vars.ECR_REPOSITORY }}" \
               --image-ids imageTag="$IMAGE_TAG" > /dev/null 2>&1; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "Imagen $IMAGE_TAG ya publicada: se reutiliza."
          fi
          echo "IMAGE=${{ steps.ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:$IMAGE_TAG" >> "$GITHUB_ENV"

      # Imagen arm64 (Fargate Graviton) desde un runner x86: emulación QEMU y builder buildx
      # (driver docker-container, necesario para --provenance/--sbom).
      - uses: docker/setup-qemu-action@v3
        if: steps.existing.outputs.found != 'true'
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v3
        if: steps.existing.outputs.found != 'true'

      - name: Construir y publicar la imagen (etiqueta inmutable = commit)
        if: steps.existing.outputs.found != 'true'
        run: |
          docker buildx build --platform linux/arm64 --target runtime --provenance=true --sbom=true \
            -t "$IMAGE" --push .

      - name: Esperar el escaneo de ECR y bloquear si hay CRITICAL
        # La etiqueta apunta a un índice OCI (imagen + atestaciones) que el escáner no analiza: se
        # escanea el manifiesto linux/arm64. Con escaneo mejorado (Inspector) el estado final es
        # ACTIVE, no COMPLETE, así que se consulta en bucle en lugar de usar `aws ecr wait`.
        env:
          REPO: ${{ vars.ECR_REPOSITORY }}
        run: |
          digest=$(aws ecr batch-get-image --repository-name "$REPO" --image-ids imageTag="$IMAGE_TAG" \
              --accepted-media-types application/vnd.oci.image.index.v1+json \
                application/vnd.docker.distribution.manifest.list.v2+json \
              --query 'images[0].imageManifest' --output text \
            | jq -r '.manifests[] | select(.platform.os == "linux" and .platform.architecture == "arm64") | .digest')
          [ -n "$digest" ] || { echo "sin manifiesto linux/arm64 en $IMAGE_TAG"; exit 1; }
          echo "manifiesto arm64: $digest"
          for _ in $(seq 1 60); do
            status=$(aws ecr describe-image-scan-findings --no-paginate --repository-name "$REPO" --image-id imageDigest="$digest" \
              --query 'imageScanStatus.status' --output text 2>/dev/null || echo PENDING)
            case "$status" in
              COMPLETE|ACTIVE) break ;;
              FAILED|UNSUPPORTED_IMAGE|SCAN_ELIGIBILITY_EXPIRED|FINDINGS_UNAVAILABLE) echo "escaneo: $status"; exit 1 ;;
            esac
            sleep 10
          done
          echo "escaneo: $status"
          [ "$status" = "COMPLETE" ] || [ "$status" = "ACTIVE" ]
          aws ecr describe-image-scan-findings --no-paginate --repository-name "$REPO" --image-id imageDigest="$digest" \
            --query 'imageScanFindings.findingSeverityCounts' --output json
          critical=$(aws ecr describe-image-scan-findings --no-paginate --repository-name "$REPO" --image-id imageDigest="$digest" \
            --query 'imageScanFindings.findingSeverityCounts.CRITICAL' --output text)
          echo "CRITICAL: $critical"
          [ "$critical" = "None" ] || [ "$critical" = "0" ]

      - name: Registrar revisiones de tarea con la imagen nueva
        run: |
          for family in "${{ vars.API_TASK_FAMILY }}" "${{ vars.MIGRATE_TASK_FAMILY }}" "${{ vars.MAINT_TASK_FAMILY }}"; do
            aws ecs describe-task-definition --task-definition "$family" --query taskDefinition \
              | jq --arg img "$IMAGE" '.containerDefinitions[0].image = $img
                  | del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy)' \
              > td.json
            arn=$(aws ecs register-task-definition --cli-input-json file://td.json --query taskDefinition.taskDefinitionArn --output text)
            echo "$family → $arn"
            key=$(echo "$family" | sed 's/.*-//' | tr '[:lower:]' '[:upper:]')
            echo "TD_${key}=$arn" >> "$GITHUB_ENV"
          done
          # EventBridge Scheduler usa la familia sin revisión: toma la última automáticamente.

      - name: Migraciones (tarea única; el despliegue se detiene si falla)
        run: |
          task=$(aws ecs run-task --cluster "${{ vars.ECS_CLUSTER }}" --launch-type FARGATE \
            --task-definition "$TD_MIGRATE" \
            --network-configuration "awsvpcConfiguration={subnets=[${{ vars.PRIVATE_SUBNETS }}],securityGroups=[${{ vars.APP_SECURITY_GROUP }}],assignPublicIp=DISABLED}" \
            --query 'tasks[0].taskArn' --output text)
          aws ecs wait tasks-stopped --cluster "${{ vars.ECS_CLUSTER }}" --tasks "$task"
          code=$(aws ecs describe-tasks --cluster "${{ vars.ECS_CLUSTER }}" --tasks "$task" \
            --query 'tasks[0].containers[0].exitCode' --output text)
          echo "migrate exit code: $code"
          [ "$code" = "0" ]

      - name: Actualizar el servicio api y esperar estabilidad (rollback automático por circuit breaker)
        run: |
          aws ecs update-service --cluster "${{ vars.ECS_CLUSTER }}" --service "${{ vars.ECS_SERVICE }}" \
            --task-definition "$TD_API" > /dev/null
          aws ecs wait services-stable --cluster "${{ vars.ECS_CLUSTER }}" --services "${{ vars.ECS_SERVICE }}"

      - name: Prueba de humo
        # SMOKE_BASE_URL = PUBLIC_BASE_URL con HTTPS; la dirección HTTP del ALB mientras https_enabled = false.
        env:
          BASE: ${{ vars.SMOKE_BASE_URL || vars.PUBLIC_BASE_URL }}
        run: |
          curl -fsS --retry 5 --retry-all-errors --retry-delay 10 "$BASE/healthz"
          curl -fsS --retry 5 --retry-all-errors --retry-delay 10 "$BASE/readyz"
