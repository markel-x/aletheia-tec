# Como CloudFront hacia el ALB: la IP del visitante en CloudFront-Viewer-Address (la API la usa
# para los límites por red, ALETHEIA_CLIENT_IP_HEADER) y el resto de la petición tal cual.
proxy_pass http://api;
proxy_http_version 1.1;
proxy_set_header Host $http_host;
proxy_set_header CloudFront-Viewer-Address "$remote_addr:$remote_port";
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_read_timeout 30s;
