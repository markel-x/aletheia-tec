# Borde local: hace en desarrollo lo que CloudFront hace en AWS (infra/terraform/frontend.tf).
#   - Rutas de la API → contenedor api (como el ALB), con CloudFront-Viewer-Address.
#   - Todo lo demás → la misma función de CloudFront (njs) y los archivos del frontend (como S3),
#     con las mismas cabeceras de seguridad y caché que publica el pipeline.
# Las listas de rutas y la CSP deben coincidir con frontend.tf: tests/test_edge_parity.py.

load_module modules/ngx_http_js_module.so;

worker_processes 1;
pid /tmp/nginx.pid;
error_log stderr warn;

events {
  worker_connections 256;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  server_tokens off;
  access_log /dev/stdout;

  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  js_path /tmp/njs/;
  js_import pages from pages.js;

  # CSP: la misma que frontend.tf (local.csp y local.docs_csp).
  map $uri $csp {
    ~^/__site/admin/static/docs\.html$ "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net/npm/swagger-ui-dist@5/; script-src 'self' https://cdn.jsdelivr.net/npm/swagger-ui-dist@5/; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'";
    default "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'";
  }
  # Caché: la que pone el pipeline al publicar en S3 (.github/workflows/deploy.yml).
  map $uri $site_cache {
    ~\.(html|js|css)$ "no-cache";
    default "public, max-age=86400";
  }

  upstream api {
    server api:8000;
  }

  server {
    listen 8080;

    # --- API: las mismas rutas que local.api_paths en frontend.tf ---------------------------
    location ~ ^/(v1|public|oid4vci|oid4vp|\.well-known|status-lists|claim-info|issuer-info|wallet)/ {
      include /etc/nginx/edge/proxy.conf;
    }
    location ~ ^/claim/[^/]*/ {
      include /etc/nginx/edge/proxy.conf;
    }
    location ~ ^/(openapi\.json|healthz|readyz)$ {
      include /etc/nginx/edge/proxy.conf;
    }

    # --- Frontend: la función de CloudFront decide ---------------------------------------
    location / {
      js_content pages.route;
    }

    # El «bucket»: sólo por redirección interna desde la función.
    location /__site/ {
      internal;
      alias /srv/site/;
      add_header Content-Security-Policy $csp always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header X-Frame-Options "DENY" always;
      add_header Referrer-Policy "no-referrer" always;
      add_header Cache-Control $site_cache always;
      # Vista previa al compartir: el pipeline completa la URL pública al publicar.
      sub_filter "__PUBLIC_BASE__" "http://127.0.0.1:8008";
      sub_filter_once off;
    }
  }
}
